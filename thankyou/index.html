<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Order Confirmed</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .dl-section { margin-top: 32px; border-top: 1px solid var(--border-glass); padding-top: 24px; }
        .dl-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(197, 155, 39, 0.03); border: 1px solid var(--border-glass); border-radius: var(--radius-md); margin-bottom: 12px; transition: var(--transition-smooth); gap: 16px; flex-wrap: wrap; }
        .dl-item:hover { border-color: var(--accent-gold-light); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .dl-item-info { display: flex; flex-direction: column; }
        .dl-item-info strong { font-size: 1rem; color: var(--text-primary); }
        .dl-item-info span { font-size: 0.8rem; color: var(--text-muted); }
        .dl-btn { padding: 10px 24px; font-size: 0.85rem; white-space: nowrap; flex-shrink: 0; }
        .success-icon { width: 64px; height: 64px; margin: 0 auto 16px; background: rgba(5, 150, 105, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .success-icon svg { width: 32px; height: 32px; fill: #059669; }
    </style>
</head>
<body style="background-image: radial-gradient(circle at center, rgba(212, 175, 55, 0.04) 0%, transparent 70%); min-height: 100vh; display: flex; flex-direction: column;">

    <div class="top-bar">
        <span class="top-bar-dot" style="background-color: #10B981; animation: none;"></span>
        YOUR ORDER HAS BEEN SUCCESSFULLY PROCESSED
    </div>

    <nav class="navbar" style="border-bottom: none; background: transparent;">
        <div class="container text-center">
            <a href="../index.html" class="logo">GrowthSuite<span style="color: var(--accent-gold);">.</span></a>
        </div>
    </nav>

    <div class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px;">
        <div class="thankyou-box" style="margin: 0 auto; width: 100%;">
            <div class="success-icon">
                <svg viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4.127-5.68z" clip-rule="evenodd" />
                </svg>
            </div>
            <h1 class="text-gold" style="font-size: 3.5rem; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.03em;">Thank You.</h1>
            <h2 id="order-heading" style="font-size: 1.75rem; font-weight: 700; margin-bottom: 8px;">Your Order is Confirmed</h2>
            <p id="order-summary-text" style="font-size: 1.05rem; margin-bottom: 12px; color: var(--text-secondary); line-height: 1.6;"></p>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 32px;">A confirmation email has been sent to <strong id="customer-email" style="color: var(--text-primary);"></strong></p>

            <div class="thankyou-steps-container">
                <h3 style="font-family: var(--font-heading); font-size: 1.35rem; font-weight: 700; margin-bottom: 24px; border-bottom: 1px solid var(--border-glass); padding-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                    <span style="color: var(--accent-gold);">&#x279E;</span> Your Download Links
                </h3>

                <div id="download-links-container"></div>
            </div>

            <div style="margin-top: 32px;">
                <a href="../index.html" class="btn btn-outline" style="padding: 16px 36px; width: 100%;">&#x2190; Back to Home</a>
            </div>

            <p style="margin-top: 40px; font-size: 0.85rem; color: var(--text-muted);">
                Need assistance? Contact our luxury onboarding team.
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        emailjs.init('MlGTESDgVHb4nBg-2');

        const PRODUCTS = {
            'growthsuite': {
                name: 'Ultimate Real Estate GrowthSuite',
                price: 196,
                desc: 'CRM, trackers, contracts, templates & more',
                driveLink: 'https://drive.google.com/PLACEHOLDER_GROWTHSUITE_REPLACE_LATER',
                icon: '\u{1F4E6}'
            },
            'directory': {
                name: 'All India Business Directory (PAN INDIA) 2026',
                price: 197,
                desc: 'Latest PAN India business database for lead generation',
                driveLink: 'https://drive.google.com/PLACEHOLDER_DIRECTORY_REPLACE_LATER',
                icon: '\u{1F4C1}'
            },
            'marketing-kit': {
                name: 'Ultimate Marketing Kit - Complete Bundle',
                price: 149,
                desc: 'Marketing templates, social media content & branding resources',
                driveLink: 'https://drive.google.com/PLACEHOLDER_MARKETING_KIT_REPLACE_LATER',
                icon: '\u{1F3A8}'
            }
        };

        function generateOrderId() {
            const num = String(Math.floor(1000 + Math.random() * 9000));
            return 'GS-' + num;
        }

        function getOrderData(products, total) {
            const subtotal = products.reduce((sum, id) => {
                const origPrices = { growthsuite: 4999, directory: 1999, 'marketing-kit': 499 };
                return sum + (origPrices[id] || PRODUCTS[id].price);
            }, 0);
            return {
                orders: products.map(id => ({
                    name: PRODUCTS[id].name,
                    units: 1,
                    price: String(PRODUCTS[id].price)
                })),
                cost: {
                    subtotal: String(subtotal),
                    discount: String(subtotal - total),
                    total: String(total)
                },
                download_links: products.map(id => ({
                    icon: PRODUCTS[id].icon,
                    url: PRODUCTS[id].driveLink,
                    name: PRODUCTS[id].name
                }))
            };
        }

        function sendInvoice(name, email, orderId, products, total) {
            const data = getOrderData(products, total);
            const templateParams = {
                email: email,
                order_id: orderId,
                orders: data.orders,
                cost: data.cost,
                download_links: data.download_links
            };
            emailjs.send('service_0v34r4l', 'template_im3kwnp', templateParams)
                .then(() => {})
                .catch(() => {});
        }

        function getParams() {
            const params = new URLSearchParams(window.location.search);
            const urlProducts = params.get('products');
            const urlTotal = params.get('total');
            const urlName = params.get('name');
            const urlEmail = params.get('email');

            const lsProducts = localStorage.getItem('gs_order_products');
            const lsTotal = localStorage.getItem('gs_order_total');
            const lsName = localStorage.getItem('gs_order_name');
            const lsEmail = localStorage.getItem('gs_order_email');

            const productsStr = urlProducts || lsProducts || 'growthsuite';
            const total = urlTotal || lsTotal || '196';
            const name = urlName || lsName || '';
            const email = urlEmail || lsEmail || '';

            localStorage.removeItem('gs_order_products');
            localStorage.removeItem('gs_order_total');
            localStorage.removeItem('gs_order_name');
            localStorage.removeItem('gs_order_email');

            return {
                products: productsStr.split(',').filter(p => p in PRODUCTS),
                total: parseInt(total),
                name: name,
                email: email
            };
        }

        function renderThankYou() {
            const { products, total, name, email } = getParams();

            if (name) {
                document.getElementById('order-heading').textContent = name + ', Your Order is Confirmed';
            }
            if (email) {
                document.getElementById('customer-email').textContent = email;
            }

            const productNames = products.map(id => PRODUCTS[id].name);
            const summary = 'You purchased: ' + productNames.join(' + ') + ' &mdash; Total: \u20B9' + total;
            document.getElementById('order-summary-text').innerHTML = summary;

            const container = document.getElementById('download-links-container');
            container.innerHTML = '';

            products.forEach(id => {
                const p = PRODUCTS[id];
                const div = document.createElement('div');
                div.className = 'dl-item';
                div.innerHTML = `
                    <div class="dl-item-info">
                        <strong>${p.icon} ${p.name}</strong>
                        <span>${p.desc}</span>
                    </div>
                    <a href="${p.driveLink}" target="_blank" class="btn btn-gold dl-btn">Download Now</a>
                `;
                container.appendChild(div);
            });

            if (email) {
                const orderId = generateOrderId();
                sendInvoice(name, email, orderId, products, total);
            }
        }

        renderThankYou();
    </script>
</body>
</html>
